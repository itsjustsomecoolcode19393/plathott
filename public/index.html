<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plathott</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        .menu-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .game-info p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .links {
            margin-top: 30px;
            font-size: 0.9em;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 15px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .version {
            margin-top: 20px;
            font-size: 0.8em;
            color: #888;
        }

        #emulator {
            max-width: 100%;
            border: 3px solid #667eea;
            border-radius: 5px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .game-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .back-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .loading {
            text-align: center;
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu Screen -->
        <div id="menuScreen" class="menu-screen">
            <h1>🐿️ Plathott</h1>
            
            <div class="game-info">
                <p><strong>A GB Studio Platformer Game</strong></p>
                <p>Navigate through levels as a speedy chipmunk!</p>
                <p style="margin-top: 15px; font-size: 0.9em; color: #aaa;">
                    Art & Box Art · Sprites by <a href="https://thinkepic.itch.io/gb-studio-sprites" style="color: #667eea;">Think Epic</a>
                </p>
            </div>

            <button class="btn" onclick="startGame()">🎮 Start Game</button>

            <div class="links">
                <a href="https://healthyburger.itch.io/plathott" target="_blank">Play Online</a>
                <a href="https://github.com/itsjustsomecoolcode19393/plathott" target="_blank">GitHub</a>
            </div>

            <div class="version">Version 1.0.0 - Desktop Edition</div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="game-screen">
            <h1>🐿️ Plathott</h1>
            <canvas id="emulator"></canvas>
            <div class="game-controls">
                <button class="btn back-btn" onclick="backToMenu()">← Back to Menu</button>
            </div>
        </div>
    </div>

    <!-- Include Gbc.js emulator -->
    <script src="https://unpkg.com/gbc.js@1.0.32/gbc.js"></script>
    
    <script>
        let emulator = null;

        async function startGame() {
            document.getElementById('menuScreen').style.display = 'none';
            
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.style.display = 'flex';
            
            // Show loading
            gameScreen.innerHTML = `
                <h1>🐿️ Plathott</h1>
                <div class="loading">
                    <p>Loading game...</p>
                    <div class="loading-spinner"></div>
                </div>
            `;

            try {
                // Initialize emulator
                const canvas = document.createElement('canvas');
                canvas.id = 'emulator';
                
                emulator = new GBC({
                    canvas: canvas,
                    cpu: {
                        instruction_cycles: 0
                    }
                });

                // Download and load the game ROM
                const romResponse = await fetch('https://github.com/itsjustsomecoolcode19393/plathott/releases/download/v1/plathott.1.gb');
                const romBuffer = await romResponse.arrayBuffer();
                
                // Load ROM into emulator
                emulator.load(romBuffer);

                // Update screen
                gameScreen.innerHTML = `
                    <h1>🐿️ Plathott</h1>
                `;
                gameScreen.appendChild(canvas);
                gameScreen.innerHTML += `
                    <div class="game-controls">
                        <button class="btn back-btn" onclick="backToMenu()">← Back to Menu</button>
                    </div>
                `;

                // Start emulation
                emulator.play();

            } catch (error) {
                console.error('Error loading game:', error);
                gameScreen.innerHTML = `
                    <h1>🐿️ Plathott</h1>
                    <div class="game-info">
                        <p>❌ Error loading game</p>
                        <p style="color: #ff6b6b;">${error.message}</p>
                    </div>
                    <button class="btn back-btn" onclick="backToMenu()">← Back to Menu</button>
                `;
            }
        }

        function backToMenu() {
            if (emulator) {
                emulator.stop();
            }
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }
    </script>
</body>
</html>
